<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Rashmi ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 2;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .heart {
      font-size: 55px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%,100% {transform: scale(1);}
      50% {transform: scale(1.2);}
    }

    #timer {
      margin: 15px 0;
      font-size: 18px;
      opacity: 0.9;
    }

    button {
      padding: 12px 26px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      margin: 10px;
      cursor: pointer;
    }

    #yesBtn {
      background: #00c853;
      color: white;
    }

    #noBtn {
      background: #ff1744;
      color: white;
      position: absolute;
    }

    #message {
      display: none;
      font-size: 26px;
      margin-top: 20px;
      font-weight: bold;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="card">
  <div class="heart">❤️</div>

  <h1>Rashmi, Will You Marry Me?</h1>

  <div id="timer">Our love timer: 00:00:00</div>

  <button id="yesBtn">Yes 💍</button>
  <button id="noBtn">No 😜</button>

  <div id="message">You said YES! 💖✨  
  Best day of my life, Rashmi ❤️</div>
</div>

<script>
/* ---------------- TIMER (since page open) ---------------- */
const timer = document.getElementById("timer");
let seconds = 0;

setInterval(() => {
  seconds++;
  let h = String(Math.floor(seconds/3600)).padStart(2,'0');
  let m = String(Math.floor((seconds%3600)/60)).padStart(2,'0');
  let s = String(seconds%60).padStart(2,'0');
  timer.innerText = `Our love timer: ${h}:${m}:${s}`;
},1000);

/* ---------------- RUNNING NO BUTTON ---------------- */
const noBtn = document.getElementById("noBtn");

noBtn.onmouseover = () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
};

/* ---------------- YES CLICK + FIREWORKS ---------------- */
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

yesBtn.onclick = () => {
  message.style.display = "block";
  yesBtn.style.display = "none";
  noBtn.style.display = "none";
  startFireworks();
};

/* ---------------- FIREWORKS ---------------- */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework() {
  const x = Math.random()*canvas.width;
  const y = Math.random()*canvas.height/2;

  for(let i=0;i<80;i++){
    particles.push({
      x,y,
      dx:(Math.random()-0.5)*6,
      dy:(Math.random()-0.5)*6,
      life:100
    });
  }
}

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;

    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();

    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(draw);
}

function startFireworks(){
  setInterval(createFirework,600);
}

draw();
</script>

</body>
</html>
