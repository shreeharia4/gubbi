<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Gubbi ❤️</title>

<style>
/* ---------------- BODY ---------------- */
body{
  margin:0;
  height:100vh;
  overflow:hidden; /* FULL SCREEN LOCK */
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Segoe UI',sans-serif;
  color:white;

  background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff4d6d,#ff9a9e);
  background-size:400% 400%;
  animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ---------------- CARD ---------------- */
.card{
  width:340px;
  max-height:92vh;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  padding:25px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

/* ---------------- GLOW NAME ---------------- */
.name{
  font-size:30px;
  font-weight:bold;
  animation:glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #fff; }
  to{ text-shadow:0 0 25px #fff,0 0 40px #ff4d6d; }
}

/* ---------------- PHOTO ---------------- */
.photo{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
  margin:12px 0;
}

/* ---------------- LETTER ---------------- */
.letter{
  font-size:14px;
  line-height:1.6;
  margin:15px 0;
}

/* ---------------- TIMER ---------------- */
.timer{
  font-size:13px;
  margin:10px 0;
  opacity:.9;
}

/* ---------------- BUTTONS ---------------- */
button{
  padding:10px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  margin:8px;
  cursor:pointer;
}

#yesBtn{background:#00c853;color:white;}
#noBtn{background:#ff1744;color:white;position:absolute;}

#message{
  display:none;
  margin-top:15px;
  font-weight:bold;
}

/* ---------------- HEARTS ---------------- */
.heart{
  position:fixed;
  bottom:-20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  to{ transform:translateY(-110vh); }
}

/* ---------------- FIREWORKS ---------------- */
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}

/* ---------------- MUSIC BTN ---------------- */
#musicBtn{
  position:fixed;
  top:12px;
  right:12px;
  font-size:22px;
  border-radius:50%;
  padding:10px;
}
</style>
</head>

<body>

<button id="musicBtn">🎵</button>
<canvas id="fireworks"></canvas>

<div class="card">

  <div class="name">Gubbi ❤️</div>

  <img src="photo.jpg" class="photo">

  <!-- LOVE TIMER -->
  <div class="timer" id="loveTimer"></div>

  <div class="letter">
    From the day you came into my life,<br>
    everything feels brighter and calmer.<br>
    Your smile is my home, your love is my world.<br><br>
    I don’t want just moments…<br>
    I want forever with you.<br><br>
    <b>Will you be my always?</b>
  </div>

  <button id="yesBtn">Always 💖</button>
  <button id="noBtn">Think again 😜</button>

  <div id="message">
    You just made me the happiest man alive ❤️<br>
    Forever yours,<br>
    — Subba
  </div>

</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* ---------------- LOVE TIMER ---------------- */
/* 👉 CHANGE THIS DATE TO YOUR FIRST MEET DATE */
const startDate = new Date("2024-11-13"); // EDIT THIS

const loveTimer = document.getElementById("loveTimer");

setInterval(()=>{
  const now = new Date();
  const diff = now - startDate;

  const days = Math.floor(diff/(1000*60*60*24));
  const hours = Math.floor((diff/(1000*60*60))%24);
  const mins = Math.floor((diff/(1000*60))%60);

  loveTimer.innerHTML =
    `Together for ${days} days ${hours} hrs ${mins} mins ❤️`;
},1000);


/* ---------------- FLOATING HEARTS ---------------- */
setInterval(()=>{
  const h=document.createElement("div");
  h.innerHTML="❤️";
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},400);


/* ---------------- MUSIC ---------------- */
const music=document.getElementById("bgMusic");
document.getElementById("musicBtn").onclick=()=>music.play();


/* ---------------- RUNNING NO ---------------- */
const noBtn=document.getElementById("noBtn");
noBtn.onmouseover=()=>{
  noBtn.style.left=Math.random()*(innerWidth-100)+"px";
  noBtn.style.top=Math.random()*(innerHeight-50)+"px";
};


/* ---------------- YES CLICK ---------------- */
const yesBtn=document.getElementById("yesBtn");
const message=document.getElementById("message");

yesBtn.onclick=()=>{
  message.style.display="block";
  yesBtn.style.display="none";
  noBtn.style.display="none";
  startFireworks();
  music.play();
};


/* ---------------- FIREWORKS ---------------- */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

function createFirework(){
  const x=Math.random()*canvas.width;
  const y=Math.random()*canvas.height/2;

  for(let i=0;i<80;i++){
    particles.push({x,y,dx:(Math.random()-0.5)*6,dy:(Math.random()-0.5)*6,life:100});
  }
}

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;
    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fill();
    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(draw);
}

function startFireworks(){
  setInterval(createFirework,600);
}

draw();
</script>

</body>
</html>
