<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Gubbi ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  color:white;
  text-align:center;

  background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff4d6d,#ff9a9e);
  background-size:400% 400%;
  animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* CARD */
.card{
  width:340px;
  margin:40px auto;
  padding:25px;
  border-radius:30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

/* GLOW NAME */
.name{
  font-size:30px;
  font-weight:bold;
  margin-bottom:10px;
  animation:glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #fff; }
  to{ text-shadow:0 0 25px #fff,0 0 40px #ff4d6d; }
}

/* PHOTO */
.photo{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
  margin:12px 0;
}

/* LETTER */
.letter{
  font-size:14px;
  line-height:1.8;
  margin:18px 0;
}

/* TIMER */
.timer{
  font-size:13px;
  margin-bottom:10px;
}

/* BUTTONS (FIXED) */
.buttons{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:10px;
}

button{
  padding:10px 22px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
}

#yesBtn{
  background:#00c853;
  color:white;
}

#noBtn{
  background:#ff1744;
  color:white;
}

/* MESSAGE */
#message{
  display:none;
  margin-top:15px;
  font-weight:bold;
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  to{ transform:translateY(-110vh); }
}

/* fireworks */
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}

/* music button */
#musicBtn{
  position:fixed;
  top:12px;
  right:12px;
  font-size:22px;
  border-radius:50%;
  padding:10px;
}
</style>
</head>

<body>

<button id="musicBtn">🎵</button>
<canvas id="fireworks"></canvas>

<div class="card">

  <div class="name">Gubbi ❤️</div>

  <img src="photo.jpg" class="photo">

  <div id="loveTimer" class="timer"></div>

  <!-- CLEAN NEW LINES -->
  <div class="letter">
    From the day you came into my life,<br><br>

    Everything feels brighter and happier.<br>
    Your smile is my peace.<br>
    Your love is my home.<br><br>

    I don’t want just moments…<br>
    I want forever with you, Gubbi.<br><br>

    <b>Will you be my always?</b>
  </div>

  <div class="buttons">
    <button id="yesBtn">Always 💖</button>
    <button id="noBtn">Think again 😜</button>
  </div>

  <div id="message">
    Kissy barli eega 😘😘😘<br>
    Forever’s Subba ❤️
  </div>

</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* LOVE TIMER */
const startDate = new Date("2024-11-13");
const loveTimer = document.getElementById("loveTimer");

setInterval(()=>{
  const now = new Date();
  const diff = now - startDate;

  const days = Math.floor(diff/(1000*60*60*24));
  const hours = Math.floor((diff/(1000*60*60))%24);
  const mins = Math.floor((diff/(1000*60))%60);

  loveTimer.innerText =
    `Together for ${days} days ${hours} hrs ${mins} mins ❤️`;
},1000);


/* floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.innerHTML="❤️";
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},400);


/* music */
const music=document.getElementById("bgMusic");
document.getElementById("musicBtn").onclick=()=>music.play();


/* RUNNING THINK AGAIN BUTTON (full screen fun 😜) */
const noBtn = document.getElementById("noBtn");

function moveButton(){
  const padding = 20;

  const maxX = window.innerWidth - noBtn.offsetWidth - padding;
  const maxY = window.innerHeight - noBtn.offsetHeight - padding;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* desktop */
noBtn.onmouseover = moveButton;

/* mobile */
noBtn.onclick = moveButton;

/* YES click */
const yesBtn=document.getElementById("yesBtn");
const message=document.getElementById("message");

yesBtn.onclick=()=>{
  message.style.display="block";
  yesBtn.style.display="none";
  noBtn.style.display="none";
  startFireworks();
  music.play();
};


/* fireworks */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

function createFirework(){
  const x=Math.random()*canvas.width;
  const y=Math.random()*canvas.height/2;

  for(let i=0;i<80;i++){
    particles.push({x,y,dx:(Math.random()-0.5)*6,dy:(Math.random()-0.5)*6,life:100});
  }
}

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach((p,i)=>{
    p.x+=p.dx;
    p.y+=p.dy;
    p.life--;
    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fill();
    if(p.life<=0) particles.splice(i,1);
  });

  requestAnimationFrame(draw);
}

function startFireworks(){
  setInterval(createFirework,600);
}

draw();
</script>

</body>
</html>
